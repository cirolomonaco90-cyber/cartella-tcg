name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # serve per pubblicare l'APK nella release "ultima-build"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: cartella-tcg-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # APK scaricabile direttamente dal telefono:
      # https://github.com/<utente>/cartella-tcg/releases/tag/ultima-build
      - name: Pubblica l'APK nella release "ultima-build"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cartella-tcg.apk
          gh release delete ultima-build --yes --cleanup-tag || true
          gh release create ultima-build cartella-tcg.apk \
            --target "$GITHUB_SHA" \
            --title "Ultima build (prova)" \
            --notes "APK di prova generato automaticamente dal commit ${GITHUB_SHA::7}. Non firmato per il Play Store." \
            --prerelease
